[package]
name = "leakwatch"
version = "0.1.0"
edition = "2024"
description = "Finds the program that is slowly breaking Windows (zombie processes, handle and memory leaks, driver pool leaks) and stops it without a restart"
license = "AGPL-3.0-only"
repository = "https://github.com/armanckeser/leakwatch"

[dependencies]
gpui = "0.2.2"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
